app = 'doi-thoai'
primary_region = 'sin'

[build]
[env]
  CORS_API = 'https://doi-thoai.fly.dev'
  DENO_KV_ACCESS_TOKEN = 'YSy+x7Cn676IRRKT7QUn'
  ORIGIN = 'http://doi-thoai.fly.dev'
  DATABASE_URL = '/deno_dir'
  DENO_DIR = '/deno_dir'

[mounts]
  source = "deno_dir"
  destination = "/deno_dir"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1